version: 2

project_name: perles

before:
  hooks:
    - sh -c "cd frontend && npm ci && npm run build"
    - go mod tidy
    - go generate ./...

builds:
  - id: perles
    main: .
    binary: perles
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: "^.*feat.*:+.*$"
      order: 0
    - title: Bug Fixes
      regexp: "^.*fix.*:+.*$"
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: hk9890
    name: perles
  draft: false
  prerelease: auto
  mode: replace
  disable: "{{ ne .Env.PUBLISH_GITHUB_RELEASES \"true\" }}"
  header: |
    ## Perles {{ .Version }}

    Terminal-based kanban board for beads issue tracking.

    This is the bootstrap release stream for hk9890/perles.

    {{- if eq .Version "v0.1.0" }}
    ### First production release notes

    - First fork-owned production release for `hk9890/perles`
    - Publishing channel for this phase: **GitHub Releases only**
    - Homebrew publishing intentionally excluded from v0.1.0 scope
    {{- end }}
  footer: |
    {{- if .PreviousTag }}
    **Full Changelog**: https://github.com/hk9890/perles/compare/{{ .PreviousTag }}...{{ .Tag }}
    {{- end }}
