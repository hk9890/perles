name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub release assets"
        required: true
        default: false
        type: boolean
      target_ref:
        description: "Tag/ref to build (required when publish=true)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release mode
        id: mode
        run: |
          set -euo pipefail

          event_name="${GITHUB_EVENT_NAME}"
          dispatch_publish="${{ github.event.inputs.publish || '' }}"
          dispatch_target_ref="${{ github.event.inputs.target_ref || '' }}"

          publish="false"
          checkout_ref="${GITHUB_REF}"

          if [[ "${event_name}" == "push" ]]; then
            publish="true"
            checkout_ref="${GITHUB_REF}"
          elif [[ "${event_name}" == "workflow_dispatch" ]]; then
            if [[ "${dispatch_publish}" == "true" ]]; then
              publish="true"
              if [[ -z "${dispatch_target_ref}" ]]; then
                echo "workflow_dispatch publish=true requires target_ref (for example refs/tags/v0.1.0 or v0.1.0)" >&2
                exit 1
              fi
              checkout_ref="${dispatch_target_ref}"
            elif [[ -n "${dispatch_target_ref}" ]]; then
              checkout_ref="${dispatch_target_ref}"
            fi
          fi

          {
            echo "publish=${publish}"
            echo "checkout_ref=${checkout_ref}"
          } >>"${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.mode.outputs.checkout_ref }}

      - name: Preflight context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "Checkout ref: ${{ steps.mode.outputs.checkout_ref }}"
          echo "Publish mode: ${{ steps.mode.outputs.publish }}"
          echo "Release publishing target: GitHub Releases only"
          echo "Required secret: GITHUB_TOKEN (provided by GitHub Actions)"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build frontend assets
        run: make build-frontend

      - name: Run tests
        run: make test

      - name: Run GoReleaser (snapshot preflight)
        if: steps.mode.outputs.publish == 'false'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_GITHUB_RELEASES: "false"

      - name: Run GoReleaser (publish)
        if: steps.mode.outputs.publish == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_GITHUB_RELEASES: "true"
